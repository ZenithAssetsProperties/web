services:
  web:
    container_name: zenith-web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-2000}:2000"
    environment:
      - PORT=2000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_NAME=${NEXT_PUBLIC_SITE_NAME:-Zenith Asset Group}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:2000}
    networks:
      - zenith-network

networks:
  zenith-network:
    name: zenith-network
    driver: bridge
