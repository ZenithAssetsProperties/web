services:
  web:
    container_name: zenith-web-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: zenith-asset-group:latest
    restart: always
    ports:
      - "${PORT:-2000}:2000"
    environment:
      - NODE_ENV=production
      - PORT=2000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_SITE_NAME=${NEXT_PUBLIC_SITE_NAME:-Zenith Asset Group}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://zenithassetgroup.com}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
